<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>ANAGRANAMES</title>
<meta name="description" content="Who are your anagranames? The people whose full name has exactly the letters of yours.">
<link rel="stylesheet" href="style.css">
<script type="module">
// The build version (data/version.json, written by web/build.mjs) is in the address of app.js and of the files
// that it loads. A browser asks the server for the version each time, so it never mixes two builds.
const { version } = await (await fetch("data/version.json", { cache: "no-cache" })).json();
document.querySelector('link[rel="stylesheet"]').href = `style.css?v=${version}`;
await import(`./app.js?v=${version}`);
</script>
</head>
<body>
<header class="top">
  <a class="brand" href="./">ANAGRANAMES</a>
  <a href="how.html">How it works</a>
</header>
<main class="wrap">
  <section class="intro">
    <h1>Who are your <span class="term">anagranames</span>?</h1>
    <div class="entry" id="entry">
      <p class="head"><dfn>anagraname</dfn> <span class="ipa">/ˌæn.ə.ɡrəˈneɪm/</span> <span class="pos">noun, neologism</span></p>
      <p class="sense">A name composed of exactly the same letters as yours, in a different order. By extension, a person bearing that name.</p>
      <p class="example">Arsène Lupin hides as Paul Sernine, his anagraname.</p>
    </div>
    <div class="dial">
      <div class="readout">
        <label for="q" class="visually-hidden">Your full name</label>
        <span id="status" class="status" aria-live="polite"></span>
        <input id="q" class="field" type="text" placeholder="Arsène Lupin" autocomplete="off" autocapitalize="words"
          spellcheck="false" enterkeyhint="search">
      </div>
      <button id="synthetic" class="switch" type="button" role="switch" aria-checked="false">
        <span class="switch-label">Synthetic people</span>
        <span class="switch-row" aria-hidden="true">
          <span class="switch-body"><span class="switch-knob"></span></span>
          <span class="switch-state">OFF</span>
          <span class="led"></span>
        </span>
      </button>
    </div>
  </section>
  <section id="view" hidden>
    <h2 id="headline" class="visually-hidden" aria-live="polite"></h2>
    <div class="panes">
      <div id="globe" class="globe">
        <canvas role="img" aria-label="A globe of the countries: drag it to turn it; click a country to choose it (the list of the countries does the same)"></canvas>
        <div class="globe-tip" hidden></div>
      </div>
      <div id="hist" class="hist pane"></div>
      <div id="people" class="pane people">
        <p class="pane-head"><span>Names</span><span id="names" class="count"></span></p>
        <ol id="results" class="results"></ol>
        <button id="more" class="chip" type="button" hidden>More</button>
      </div>
    </div>
  </section>
</main>
</body>
</html>
