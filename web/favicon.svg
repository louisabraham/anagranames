<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The icon of the site: an A in front of the globe, traces of cyan phosphor on the dark screen. The A is a path (an
       icon cannot load the fonts of the page). PNG copies: favicon-32.png, apple-touch-icon.png (rendered from it). -->
  <defs>
    <radialGradient id="screen" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#06303a"/>
      <stop offset="1" stop-color="#010708"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sphere"><circle cx="32" cy="32" r="24"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#screen)"/>
  <g fill="none" stroke="#00ffe5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <g clip-path="url(#sphere)" stroke-width="2" stroke-opacity="0.45">
      <ellipse cx="32" cy="32" rx="12" ry="24"/>
      <line x1="8" y1="24" x2="56" y2="24"/>
      <line x1="8" y1="44" x2="56" y2="44"/>
    </g>
    <circle cx="32" cy="32" r="24" stroke-width="3.4"/>
    <path d="M20.5 47 L32 15.5 L43.5 47 M24.8 36.5 H39.2" stroke="#ebfffc" stroke-width="5.2"/>
  </g>
</svg>
