<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The icon of the site: the globe, a little tilted, with its net of meridians and parallels, and a small A in front, traces of cyan
       phosphor on the dark screen. The A is a path (an icon cannot load the fonts of the page), with a dark border that
       keeps it apart from the net. PNG copies: favicon-32.png, apple-touch-icon.png (rendered from it). -->
  <defs>
    <radialGradient id="screen" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#06303a"/>
      <stop offset="1" stop-color="#010708"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sphere"><circle cx="32" cy="32" r="29"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#screen)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#00ffe5" filter="url(#glow)">
      <g clip-path="url(#sphere)" stroke-width="2" stroke-opacity="0.75">
        <line x1="32" y1="2" x2="32" y2="62"/>
        <ellipse cx="32" cy="32" rx="14.5" ry="29"/>
        <ellipse cx="32" cy="32" rx="25" ry="29"/>
        <path d="M3 32 A29 9.9 0 0 0 61 32"/>
        <path d="M8.25 16.4 A23.75 8.1 0 0 0 55.75 16.4"/>
        <path d="M8.25 47.6 A23.75 8.1 0 0 0 55.75 47.6"/>
      </g>
      <circle cx="32" cy="32" r="29" stroke-width="3"/>
    </g>
    <path d="M24.5 43 L32 22 L39.5 43 M27.2 35.5 H36.8" stroke="#041a1e" stroke-width="7.5"/>
    <path d="M24.5 43 L32 22 L39.5 43 M27.2 35.5 H36.8" stroke="#ebfffc" stroke-width="3"/>
  </g>
</svg>
